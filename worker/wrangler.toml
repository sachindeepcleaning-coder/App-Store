name = "app-store"
main = "index.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = false

[vars]
GITHUB_OWNER = "sachindeepcleaning-coder"
GITHUB_REPO = "my-apps"
GITHUB_BRANCH = "main"
PASSWORD_MIN_LENGTH = "10"

[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60
